name: check-pull-request-base-branch

on:
  pull_request:
    types: [edited, opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate-base-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check base branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -e
                  
          # Explicitly authorized Swift 6 review stack. Other branch rules stay below.
          case "$HEAD_BRANCH" in
            "czoli1976/VIDSOL-000-swift6-stack-compatibility") STACK_BASE="czoli1976/VIDSOL-000-swift6-stack-foundation" ;;
            "czoli1976/VIDSOL-000-swift6-stack-ownership") STACK_BASE="czoli1976/VIDSOL-000-swift6-stack-compatibility" ;;
            "czoli1976/VIDSOL-000-swift6-stack-authentication") STACK_BASE="czoli1976/VIDSOL-000-swift6-stack-ownership" ;;
            "czoli1976/VIDSOL-000-swift6-stack-activation") STACK_BASE="czoli1976/VIDSOL-000-swift6-stack-authentication" ;;
            *) STACK_BASE="" ;;
          esac
          if [[ -n "$STACK_BASE" && "$BASE_BRANCH" == "$STACK_BASE" ]]; then
            echo "Recognized Swift 6 review stack: $HEAD_BRANCH -> $BASE_BRANCH"
            exit 0
          fi

          # Check if head branch starts with 'release-'
          if [[ "$HEAD_BRANCH" == release-* ]]; then
            echo "Release branch detected: $HEAD_BRANCH"
            if [[ "$BASE_BRANCH" == "main" || "$BASE_BRANCH" == "develop" ]]; then
              echo "Release branch targeting '$BASE_BRANCH' - VALID"
              exit 0
            else
              echo "Release branches must target 'main' or 'develop', but found '$BASE_BRANCH'"
              exit 1
            fi
          else
            # For non-release branches, base must be develop
            if [[ "$BASE_BRANCH" == "develop" ]]; then
              echo "Non-release branch targeting develop - VALID"
              exit 0
            else
              echo "Non-release branches must target 'develop', but found '$BASE_BRANCH'"
              echo "Note: Only branches starting with 'release-' can target 'main'"
              exit 1
            fi
          fi
        shell: bash
